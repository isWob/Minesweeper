name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 支持手动触发
  workflow_dispatch:

# 同分支并发时取消旧任务，避免重复部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write
  # enablement: true 自动创建 Pages 站点需要 administration 权限
  administration: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 仓库名为 <owner>/Minesweeper 时 Pages URL 是 https://<owner>.github.io/Minesweeper/
          # 若仓库名为 <owner>.github.io，需将 PAGE_BASE 改为 "/"
          PAGE_BASE: /Minesweeper/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用 Pages，免去手动到 Settings → Pages 设置 Source
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
